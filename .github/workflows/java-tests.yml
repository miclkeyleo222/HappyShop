name: HappyShop Java Tests

on:
  push:
    branches: [development, feature/trolley-improvements]
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run JUnit tests
        run: mvn -B test
